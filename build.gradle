plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// In-game tests (src/gametest):
// ./gradlew runGameTest        -> server game tests (headless, every haunting event and the boss)
// ./gradlew runClientGameTest  -> client game test (renders the entities and saves screenshots in build/run/clientGameTest/screenshots)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "dontfollowthemap-gametest"
		enableGameTests = true
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mod_id", mod_id
	inputs.property "mod_name", mod_name
	inputs.property "mod_description", mod_description
	inputs.property "mod_authors", mod_authors
	inputs.property "mod_license", mod_license

	filesMatching("fabric.mod.json") {
		expand([
				"version": project.version,
				"mod_id": mod_id,
				"mod_name": mod_name,
				"mod_description": mod_description,
				"mod_authors": mod_authors,
				"mod_license": mod_license
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}
